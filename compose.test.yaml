name: persofi-tests

services:
  database:
    image: mysql:8.0.45
    environment:
      MYSQL_DATABASE: persofi_test
      MYSQL_USER: persofi_test
      MYSQL_PASSWORD: ${PERSOFI_TEST_DATABASE_PASSWORD:?Set by scripts/run-backend-tests.sh}
      MYSQL_ROOT_PASSWORD: ${PERSOFI_TEST_ROOT_PASSWORD:?Set by scripts/run-backend-tests.sh}
    tmpfs:
      - /var/lib/mysql:rw,noexec,nosuid,size=1g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysql --user="$$MYSQL_USER" --password="$$MYSQL_PASSWORD" --silent --execute="SELECT 1" "$$MYSQL_DATABASE"',
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  tests:
    build:
      context: ./app
      dockerfile: Dockerfile.test
    environment:
      NODE_ENV: test
      DATABASE_URL: mysql://persofi_test:${PERSOFI_TEST_DATABASE_PASSWORD}@database:3306/persofi_test
    depends_on:
      database:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        ${PERSOFI_TEST_COMMAND:-npx prisma migrate deploy &&
        node dist/prisma/seed.js &&
        npm test}
